openapi: 3.1.0
info:
  title: OpenTPRM API
  version: 1.0.0
  description: Self-hosted third-party risk management REST API (§10).
servers:
  - url: /api/v1
tags:
  - name: vendors
  - name: intakes
  - name: assessments
  - name: questionnaires
  - name: evidence
  - name: findings
  - name: risk
  - name: exceptions
  - name: contracts
  - name: monitoring
  - name: reports
  - name: agents
  - name: admin
  - name: audit
paths:
  /me:
    get:
      summary: Current principal profile
      operationId: getMe
      responses:
        "200": { description: OK }
  /vendors:
    get:
      tags: [vendors]
      summary: List vendors
      operationId: listVendors
      responses:
        "200": { description: OK }
    post:
      tags: [vendors]
      summary: Create vendor
      operationId: createVendor
      responses:
        "201": { description: Created }
  /vendors/{id}:
    get:
      tags: [vendors]
      summary: Get vendor
      operationId: getVendor
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    put:
      tags: [vendors]
      summary: Update vendor
      operationId: updateVendor
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
        "412": { description: Precondition failed }
  /vendors/{id}:merge:
    post:
      tags: [vendors]
      summary: Merge source vendor into this vendor
      operationId: mergeVendor
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Merged }
  /vendors/{id}/history:
    get:
      tags: [vendors]
      summary: Vendor change history
      operationId: vendorHistory
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /vendors/{id}/contacts:
    get:
      tags: [vendors]
      summary: List vendor contacts
      operationId: listContacts
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    post:
      tags: [vendors]
      summary: Create vendor contact
      operationId: createContact
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201": { description: Created }
  /vendors/{id}/engagements:
    get:
      tags: [vendors]
      summary: List engagements
      operationId: listEngagements
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    post:
      tags: [vendors]
      summary: Create engagement
      operationId: createEngagement
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201": { description: Created }
  /vendors:import:
    post:
      tags: [vendors]
      summary: Bulk-import vendors from CSV
      operationId: importVendors
      responses:
        "200": { description: Row-level report }
  /fourth-party-links:
    get:
      tags: [vendors]
      summary: List fourth-party links
      operationId: listFourthPartyLinks
      responses:
        "200": { description: OK }
    post:
      tags: [vendors]
      summary: Create fourth-party link
      operationId: createFourthPartyLink
      responses:
        "201": { description: Created }
  /intakes:
    post:
      tags: [intakes]
      summary: Create intake
      operationId: createIntake
      responses:
        "201": { description: Created }
  /intakes/{id}:submit:
    post:
      tags: [intakes]
      summary: Submit intake and compute inherent-risk tier
      operationId: submitIntake
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Tier and diligence plan }
  /assessments:
    get:
      tags: [assessments]
      summary: List assessments
      operationId: listAssessments
      responses:
        "200": { description: OK }
    post:
      tags: [assessments]
      summary: Create assessment
      operationId: createAssessment
      responses:
        "201": { description: Created }
  /assessments/{id}:transition:
    post:
      tags: [assessments]
      summary: Transition assessment state machine
      operationId: transitionAssessment
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Updated }
        "422": { description: Illegal transition }
  /questionnaire-templates:
    get:
      tags: [questionnaires]
      summary: List questionnaire templates
      operationId: listQuestionnaireTemplates
      responses:
        "200": { description: OK }
    post:
      tags: [questionnaires]
      summary: Create questionnaire template
      operationId: createQuestionnaireTemplate
      responses:
        "201": { description: Created }
  /questionnaire-templates/{id}/versions:
    get:
      tags: [questionnaires]
      summary: List template versions
      operationId: listTemplateVersions
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    post:
      tags: [questionnaires]
      summary: Create draft template version
      operationId: createTemplateVersion
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201": { description: Created }
  "/questionnaire-templates/{id}/versions/{vid}:publish":
    post:
      tags: [questionnaires]
      summary: Publish template version (SOD)
      operationId: publishTemplateVersion
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: vid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Published }
        "422": { description: Publish failed }
  /questionnaire-instances:
    get:
      tags: [questionnaires]
      summary: List questionnaire instances
      operationId: listQuestionnaireInstances
      responses:
        "200": { description: OK }
    post:
      tags: [questionnaires]
      summary: Create instance (optional delta_of for AT-15)
      operationId: createQuestionnaireInstance
      responses:
        "201": { description: Created with optional delta prefill }
  /questionnaire-instances/{id}:
    get:
      tags: [questionnaires]
      summary: Get questionnaire instance
      operationId: getQuestionnaireInstance
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  "/questionnaire-instances/{id}:delta":
    get:
      tags: [questionnaires]
      summary: AT-15 delta prefill for reassessment instance
      operationId: getQuestionnaireInstanceDelta
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Prefill with changed and confirm keys }
  /questionnaire-instances/{id}/responses:
    get:
      tags: [questionnaires]
      summary: List response revisions
      operationId: listInstanceResponses
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    post:
      tags: [questionnaires]
      summary: Append response revision
      operationId: appendInstanceResponse
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201": { description: Created }
  /questionnaire-instances/{id}/reviews:
    get:
      tags: [questionnaires]
      summary: List answer reviews
      operationId: listInstanceReviews
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    post:
      tags: [questionnaires]
      summary: Upsert answer review/score
      operationId: upsertInstanceReview
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /answer-library:
    get:
      tags: [questionnaires]
      summary: List per-vendor answer library (QST-035)
      operationId: listAnswerLibrary
      parameters:
        - name: vendor_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
    post:
      tags: [questionnaires]
      summary: Upsert answer library entry
      operationId: upsertAnswerLibrary
      responses:
        "201": { description: Created or updated }
  /questionnaire-instances/{id}/score:
    get:
      tags: [questionnaires]
      summary: Aggregate review score
      operationId: getInstanceScore
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /uploads:
    post:
      tags: [evidence]
      summary: Create chunked upload session (JSON) or single-shot raw body
      operationId: createUpload
      responses:
        "201": { description: Session created }
        "202": { description: Accepted into quarantine }
        "422": { description: Rejected }
  /uploads/{id}:
    put:
      tags: [evidence]
      summary: Append upload chunk
      operationId: appendUploadChunk
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Chunk accepted }
        "422": { description: Rejected }
  "/uploads/{id}:complete":
    post:
      tags: [evidence]
      summary: Complete upload — validate, encrypt blob, quarantine evidence
      operationId: completeUpload
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "202": { description: Quarantined }
        "422": { description: Rejected }
  /evidence:
    get:
      tags: [evidence]
      summary: List evidence metadata
      operationId: listEvidence
      responses:
        "200": { description: OK }
  /evidence/{id}/pages:
    get:
      tags: [evidence]
      summary: List safe-viewer pages
      operationId: listEvidencePages
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    put:
      tags: [evidence]
      summary: Store sanitized page text
      operationId: putEvidencePage
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /evidence/{id}/pages/{page}/text:
    get:
      tags: [evidence]
      summary: Safe viewer text stub (EVD-007)
      operationId: getEvidencePageText
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: page
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Sanitized text }
  /evidence/{id}/pages/{page}/html:
    get:
      tags: [evidence]
      summary: Safe viewer HTML page (EVD-007)
      operationId: getEvidencePageHTML
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: page
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: CSP-safe HTML }
  /evidence/{id}/soc-review:
    get:
      tags: [evidence]
      summary: Get SOC review (EVD-020 schema)
      operationId: getSOCReview
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    put:
      tags: [evidence]
      summary: Upsert SOC review JSON
      operationId: putSOCReview
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /findings:
    get:
      tags: [findings]
      summary: List findings
      operationId: listFindings
      responses:
        "200": { description: OK }
    post:
      tags: [findings]
      summary: Create finding
      operationId: createFinding
      responses:
        "201": { description: Created }
  /findings/{id}:transition:
    post:
      tags: [findings]
      summary: Transition finding status (FND-002)
      operationId: transitionFinding
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
        "422": { description: Illegal transition }
  /findings/{id}/remediation-plan:
    get:
      tags: [findings]
      summary: Get remediation plan
      operationId: getRemediationPlan
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    put:
      tags: [findings]
      summary: Upsert remediation plan
      operationId: upsertRemediationPlan
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /risk/compute:
    post:
      tags: [risk]
      summary: Compute residual risk
      operationId: computeRisk
      responses:
        "200": { description: OK }
  /risk-register:
    get:
      tags: [risk]
      summary: Risk register view
      operationId: riskRegister
      responses:
        "200": { description: OK }
    post:
      tags: [risk]
      summary: Persist residual risk result
      operationId: persistRiskResult
      responses:
        "201": { description: Created }
  /exceptions:
    get:
      tags: [exceptions]
      summary: List exceptions register
      operationId: listExceptions
      responses:
        "200": { description: OK }
    post:
      tags: [exceptions]
      summary: Create exception request
      operationId: createException
      responses:
        "201": { description: Created }
  /exceptions/{id}:approve:
    post:
      tags: [exceptions]
      summary: Approve exception (humans only, SOD-2, signed decision)
      operationId: approveException
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Signed decision }
        "403": { description: Forbidden (incl. SOD-2 requester==approver) }
  /reports/{type}:
    get:
      tags: [reports]
      summary: Generate marked report (GEN-012)
      operationId: getReport
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [inventory, exceptions, committee, audit_pack, kri] }
        - name: classification
          in: query
          schema: { type: string }
      responses:
        "200": { description: Marked document }
  /exports:
    get:
      tags: [reports]
      summary: List export jobs
      operationId: listExports
      responses:
        "200": { description: OK }
    post:
      tags: [reports]
      summary: Create export (sensitive bulk needs step-up)
      operationId: createExport
      responses:
        "201": { description: Created }
        "401": { description: Step-up required }
  "/exports/{id}:approve":
    post:
      tags: [reports]
      summary: Second approver for Client-Confidential/Privileged bulk (RPT-004)
      operationId: approveExportSecond
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Approved }
        "401": { description: Step-up required }
        "403": { description: SOD — requester cannot self-approve }
  /contracts:
    get:
      tags: [contracts]
      summary: List contracts
      operationId: listContracts
      responses:
        "200": { description: OK }
    post:
      tags: [contracts]
      summary: Create contract
      operationId: createContract
      responses:
        "201": { description: Created }
  /obligations:
    get:
      tags: [contracts]
      summary: List obligations
      operationId: listObligations
      responses:
        "200": { description: OK }
    post:
      tags: [contracts]
      summary: Create obligation
      operationId: createObligation
      responses:
        "201": { description: Created }
  /clients:
    post:
      tags: [contracts]
      summary: Create client
      operationId: createClient
      responses:
        "201": { description: Created }
  /clients/{id}/requirements:
    post:
      tags: [contracts]
      summary: Create client requirement
      operationId: createClientRequirement
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201": { description: Created }
  /clients/{id}/requirements/{rid}:flow-down:
    post:
      tags: [contracts]
      summary: Flow client requirement to engagement obligation
      operationId: flowDownRequirement
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: rid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Created }
  /monitoring/signals:
    get:
      tags: [monitoring]
      summary: List monitoring signals
      operationId: listMonitoringSignals
      responses:
        "200": { description: OK }
    post:
      tags: [monitoring]
      summary: Create monitoring signal
      operationId: createMonitoringSignal
      responses:
        "201": { description: Created }
  /monitoring/signals/{id}:disposition:
    post:
      tags: [monitoring]
      summary: Set analyst disposition (MON-005)
      operationId: setMonitoringDisposition
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /offboarding:
    post:
      tags: [offboarding]
      summary: Create offboarding checklist
      operationId: createOffboardingChecklist
      responses:
        "201": { description: Created }
  /offboarding/{id}:
    get:
      tags: [offboarding]
      summary: Get offboarding checklist by engagement id
      operationId: getOffboardingChecklist
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /offboarding/{id}/items:
    post:
      tags: [offboarding]
      summary: Mark offboarding checklist item
      operationId: markOffboardingItem
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /legal-holds:
    post:
      tags: [admin]
      summary: Place legal hold
      operationId: placeLegalHold
      responses:
        "201": { description: Created }
  /legal-holds/{id}:release:
    post:
      tags: [admin]
      summary: Release legal hold (second authorized user)
      operationId: releaseLegalHold
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
  /suggestions:
    get:
      tags: [agents]
      summary: List AI suggestions
      operationId: listSuggestions
      responses:
        "200": { description: OK }
    post:
      tags: [agents]
      summary: Create AI suggestion
      operationId: createSuggestion
      responses:
        "201": { description: Created }
  /change-requests:
    get:
      tags: [agents]
      summary: List change requests
      operationId: listChangeRequests
      responses:
        "200": { description: OK }
    post:
      tags: [agents]
      summary: Create change request
      operationId: createChangeRequest
      responses:
        "201": { description: Created }
  /agent-clients:
    get:
      tags: [agents]
      summary: List agent clients (Security Administrator)
      operationId: listAgentClients
      responses:
        "200": { description: OK }
    post:
      tags: [agents]
      summary: Create agent client
      operationId: createAgentClient
      responses:
        "201": { description: Created }
  /model-endpoints:
    get:
      tags: [agents]
      summary: List model endpoints
      operationId: listModelEndpoints
      responses:
        "200": { description: OK }
    post:
      tags: [agents]
      summary: Register model endpoint
      operationId: createModelEndpoint
      responses:
        "201": { description: Created }
  /model-endpoints/{id}:
    get:
      tags: [agents]
      summary: Get model endpoint
      operationId: getModelEndpoint
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    patch:
      tags: [agents]
      summary: Update model endpoint
      operationId: updateModelEndpoint
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
    delete:
      tags: [agents]
      summary: Delete model endpoint
      operationId: deleteModelEndpoint
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204": { description: Deleted }
  /ai/jobs:
    post:
      tags: [agents]
      summary: Run suggestions-only AI job stub
      operationId: createAIJob
      responses:
        "201": { description: Created }
        "403": { description: Non-suggest job refused }
        "503": { description: AI assist disabled }
  /change-requests/{id}:approve:
    post:
      tags: [agents]
      summary: Approve change request (step-up required)
      operationId: approveChangeRequest
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: OK }
        "401": { description: Step-up required }
  /models:
    get:
      tags: [agents]
      summary: List models
      operationId: listModels
      responses:
        "200": { description: OK }
    post:
      tags: [agents]
      summary: Register model
      operationId: createModel
      responses:
        "201": { description: Created }
  /agent/tools:
    get:
      tags: [agents]
      summary: Agent tool registry (invoke via /mcp)
      operationId: agentTools
      responses:
        "200": { description: OK }
  /agent/call:
    post:
      tags: [agents]
      summary: Invoke tool via Agent Gateway
      operationId: agentCall
      responses:
        "200": { description: OK }
        "403": { description: Forbidden }
        "404": { description: Unknown tool }
  /audit/verify:
    post:
      tags: [audit]
      summary: Verify audit hash chain
      operationId: auditVerify
      responses:
        "200": { description: OK }
        "409": { description: Chain broken }
  /admin/settings:
    get:
      tags: [admin]
      summary: Admin settings
      operationId: adminSettings
      responses:
        "200": { description: OK }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-otp_s
    dpop:
      type: http
      scheme: DPoP
