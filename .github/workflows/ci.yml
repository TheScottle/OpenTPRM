name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.22.10 -quiet -fmt text ./...
      - name: CycloneDX SBOM
        run: |
          go build -o /tmp/opentprm ./cmd/opentprm
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 app -json -output /tmp/opentprm.cdx.json -main cmd/opentprm .
          test -s /tmp/opentprm.cdx.json
          python3 -c "import json; d=json.load(open('/tmp/opentprm.cdx.json')); assert d.get('bomFormat')=='CycloneDX', d"
      - name: License allow-list (basic)
        run: |
          go list -m all | awk '{print $1}' > /tmp/mods.txt
          if grep -E 'github.com/.*/(gopkg-in-yaml|AGPL)' /tmp/mods.txt; then exit 1; fi
          echo "module list captured for SEC-SC-006 review"
