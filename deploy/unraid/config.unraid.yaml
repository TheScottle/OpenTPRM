# Production-oriented config for Unraid host path mounts.
# Copy to /mnt/user/appdata/opentprm/config/config.yaml
#
# TLS and master key paths match the bind mounts in docker-compose.unraid.yml
# and the Community Applications template (opentprm.xml).

mode: production
server:
  internal:
    listen: "0.0.0.0:8443"
    require_client_cert: false
    tls:
      cert_file: /run/secrets/opentprm_tls_cert
      key_file: /run/secrets/opentprm_tls_key
  portal:
    enabled: false
    listen: "0.0.0.0:9443"
    trusted_proxies: []
  metrics:
    listen: "127.0.0.1:9090"
  # REQUIRED for browser login/CSRF: the URL you type in the browser (LAN IP or hostname).
  # Example: https://192.168.1.50:8443 — do not leave this as 0.0.0.0.
  public_base_url: "https://REPLACE_WITH_LAN_IP:8443"
keys:
  master_key_file: /run/secrets/opentprm_master_key
identity:
  oidc:
    issuer: ""
    client_id: ""
    client_secret_file: ""
    require_amr: ["mfa"]
    group_role_map: {}
  session:
    idle_minutes: 30
    absolute_hours: 12
agents:
  mcp:
    enabled: true
    protocol: "2026-07-28"
    compat_2025_11_25: false
  oauth:
    dcr: false
    access_token_ttl: 10m
    require_sender_constraint: true
ai_assist:
  enabled: false
network:
  egress: none
  allow: []
storage:
  data_dir: /data
  backup_dir: /backup
retention:
  ai_logs_days: 90
  audit_years: 7
  evidence_years_after_end: 7
labels:
  markings:
    Privileged: "Privileged & Confidential — Prepared at the Direction of Counsel"
portal:
  enabled: false
